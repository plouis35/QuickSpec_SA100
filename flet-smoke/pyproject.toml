[project]
name = "quickspec-flet-smoke"
version = "0.1.0"
description = "Minimal Flet Android APK test"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "QuickSpec" }]
dependencies = [
    "flet>=1.0.5",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "Pillow==12.3.0",
    "scipy==1.18.0",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.5",
    "flet-desktop>=1.0.5",
    "flet-web>=1.0.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "fr.plouis"
product = "QuickSpec Flet Test"
company = "QuickSpec"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx1500m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError"

[tool.flet.android]
extract_packages = ["matplotlib"]

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"
