[project]
name = "quickspec-sa100-flet"
version = "0.1.0"
description = "QuickSpec SA100 Flet application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flet>=1.0.5,<2",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "Pillow==12.3.0",
    "scipy==1.18.0",
]

[tool.flet]
org = "fr.plouis"
product = "QuickSpec SA100"
company = "QuickSpec"

[tool.flet.android]
target_arch = ["arm64-v8a"]
extract_packages = ["matplotlib"]

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx1500m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError"

[tool.flet.app]
path = "."
module = "flet_app"
exclude = [
    ".buildozer",
    "bin",
    "flet-smoke",
    "requirements-flet.txt",
    "test_*.py",
]
